hints.name=Compose parameter stability
hints.description=Static stability estimates for Jewel and Compose parameters. Hover over a hint for the reason. No runtime instrumentation is required.
hint.stable=stable
hint.unstable=unstable
hint.unknown=unknown
hint.tooltip={0}: {1}\n{2}\n\nStatic estimate, not a Compose compiler report. Stability does not by itself determine skipping; strong skipping can skip unstable parameters. Custom stability configuration files are not read in v1.
reason.builtin=Primitive, String, Unit, or Nothing: a built-in stable type.
reason.function=Function types are treated as stable by Compose. This does not mean the same function instance is passed on every execution.
reason.contract=The type declares the Compose {0} contract. The annotation is trusted, not verified.
reason.enum=Enum values have stable identity.
reason.collection=Standard collections and arrays do not guarantee immutable contents to the Compose compiler.
reason.unresolved=The type could not be resolved. Wait for indexing or check the project dependencies.
reason.unsupported=This type requires compiler analysis that this prototype does not model.
reason.external=An unannotated type from a library or another IDE module. Its compiler stability metadata is not interpreted in v1.
reason.open=An interface or extensible class can have implementations with different stability.
reason.inheritance=Inherited state and inherited stability contracts require compiler analysis that this version does not model.
reason.recursive=Recursive or deeply nested types require compiler analysis that this prototype does not model.
reason.delegated=Delegated property {0} requires analysis of its delegate; v1 leaves it unknown.
reason.mutable=Property {0} has a mutable backing field without a declared class stability contract.
reason.property=Property {0}: {1}
reason.fields=All stored properties of this final source class have stable types (inferred estimate).
reason.vararg=Vararg parameters are passed as arrays, which do not guarantee immutable contents.
hint.receiver=receiver
reason.singleton=Singleton state is not modeled by this version. Declare a Compose stability contract only if the type satisfies it.
reason.valueClass=Value-class stability, including unsigned types, is not modeled by this version.
reason.platformType=Java platform-type stability is not modeled by this version.
reason.unsupportedContract=This type uses a custom Compose stability contract that this version does not interpret.
reason.typeArgument=A type argument is unknown or unspecialized, so its stability cannot be inferred.
reason.bounded=The bounded analysis budget was exhausted. This is an unknown estimate, not evidence of instability.
reason.captured=Inner and local classes can capture state that this version does not model.
