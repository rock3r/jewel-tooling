name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Formatting, Detekt, and documentation links
        run: python3 scripts/validate.py fast
      - name: Analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analysis-reports
          path: |
            build/reports/detekt/
            recording/build/reports/detekt/
            recording-compose/build/reports/detekt/
            agent/build/reports/detekt/
            mcp-runtime/build/reports/detekt/
            fixtures/standalone/build/reports/detekt/
          if-no-files-found: warn
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Tests, plugin ZIP, and screenshot provenance
        run: python3 scripts/validate.py package
      - name: Production distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-plugin
          path: |
            build/distributions/jewel-tooling-*.zip
            build/distributions/jewel-tooling-*.zip.sha256
          if-no-files-found: error
      - name: Diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-reports
          path: |
            build/reports/
            build/test-results/
            recording/build/reports/
            recording/build/test-results/
            recording-compose/build/reports/
            recording-compose/build/test-results/
            agent/build/reports/
            agent/build/test-results/
            e2e/driver-plugin/build/reports/
            e2e/runner/build/reports/
            test-fixtures/compiler-metadata/build/reports/
            fixtures/standalone/build/reports/detekt/
          if-no-files-found: warn
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: JVM module coverage
        run: ./gradlew :koverHtmlReport :koverXmlReport
      - name: Coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            build/reports/kover/
            recording/build/reports/kover/
            recording-compose/build/reports/kover/
            mcp-runtime/build/reports/kover/
            agent/build/reports/kover/
          if-no-files-found: warn
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libasound2t64 libxi6 libxtst6 libxrender1 fonts-dejavu gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good x11-utils
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-version: 1.27.0
          module-root: fixtures/ijpl
          bazelisk-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Real standalone and IJPL workflows with Spectre
        run: xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' python3 scripts/validate.py e2e
      - name: E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence
          path: |
            e2e/runner/build/reports/
            e2e/runner/build/test-results/
            e2e/runner/build/artifacts/
            fixtures/standalone/build/reports/
            fixtures/standalone/build/test-results/
            fixtures/standalone/build/capture/
            fixtures/ijpl/build/ide-project/model-evidence.json
          if-no-files-found: error
